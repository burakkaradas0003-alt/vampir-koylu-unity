# Unity web (WebGL) derlemesi. Depo herkese açık olduğu için GitHub Actions ücretsizdir.
# Gerekli gizli değerler (Settings > Secrets and variables > Actions):
#   UNITY_USERNAME : Unity hesabının e-postası
#   UNITY_PASSWORD : Unity hesabının şifresi (iki adımlı doğrulama kapalı olmalı)
name: WebGL
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: webgl
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Disk aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: RageAgainstThePixel/unity-setup@v3
        with:
          version-file: 'None'
          unity-version: '6000.0'
          build-targets: WebGL
          cache-installation: true
      - uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
      - uses: actions/cache@v4
        with:
          path: Library
          key: library-webgl-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: library-webgl-
      - uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: WebGL
          log-name: WebGL-Build
          args: -quit -batchmode -nographics -executeMethod BuildSetup.BuildWebGL
      - uses: actions/upload-artifact@v4
        with:
          name: webgl
          path: Builds/WebGL
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            Builds/Logs
            Logs
          retention-days: 7
